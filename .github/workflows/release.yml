name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DUCKDB_VERSION: "v1.3.2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            binary: updcli-linux-amd64

          - os: ubuntu-24.04-arm
            platform: linux/arm64
            binary: updcli-linux-arm64

          - os: macos-26-intel
            arch: x86_64
            binary: updcli-darwin-amd64

          - os: macos-latest
            arch: arm64
            binary: updcli-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Linux (Docker static build) ----------

      - name: Set up Docker Buildx
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/setup-buildx-action@v3

      # Step 1: cache the heavy duckdb stage
      - name: Cache duckdb-builder stage
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/build-push-action@v7
        with:
          target: duckdb-builder
          push: false
          cache-from: type=gha,scope=duckdb-builder-${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=duckdb-builder-${{ matrix.binary }}

      # Step 2: full build pulling duckdb layers from cache
      - name: Build (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./bin
          cache-from: type=gha,scope=duckdb-builder-${{ matrix.binary }}

      - name: Move binary
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          echo "=== contents of ./bin ==="
          find ./bin -type f
          mv ./bin/usr/local/bin/updcli ./bin/${{ matrix.binary }} || {
            echo "Binary not found at expected path. Contents of ./bin:"
            find ./bin -type f
            exit 1
          }
      # ---------- macOS (native static build) ----------
      - name: Install Crystal (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install crystal

      - name: Cache DuckDB (macOS)
        if: startsWith(matrix.os, 'macos')
        id: cache-duckdb
        uses: actions/cache@v4
        with:
          path: duckdb/build/release
          key: duckdb-darwin-${{ matrix.arch }}-${{ env.DUCKDB_VERSION }}

      - name: Build DuckDB static library (macOS)
        if: startsWith(matrix.os, 'macos') && steps.cache-duckdb.outputs.cache-hit != 'true'
        run: |
          brew install cmake ninja
          git clone --depth 1 --branch ${{ env.DUCKDB_VERSION }} \
            https://github.com/duckdb/duckdb.git
          cd duckdb
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_UNITTESTS=OFF \
            -DENABLE_SANITIZER=OFF \
            -DDISABLE_EXTENSION_LOAD=1 \
            -DCORE_EXTENSIONS='icu;json;parquet' \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -B build/release -S .
          cmake --build build/release --config Release

          mkdir -p build/release/merged/extract
          find $(pwd)/build/release -name "*.a" -not -path "*/merged/*" | while read lib; do
            [ -f "$lib" ] || { echo "Skipping missing: $lib"; continue; }
            libname=$(basename "$lib" .a)
            mkdir -p "build/release/merged/extract/${libname}"
            (cd "build/release/merged/extract/${libname}" && ar x "$lib")
          done
          find build/release/merged/extract -name "*.o" > objects.txt
          libtool -static -o build/release/libduckdb.a $(cat objects.txt)

      - name: Cache shards (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: shards-darwin-${{ matrix.arch }}-${{ hashFiles('shard.lock') }}
          restore-keys: shards-darwin-${{ matrix.arch }}-

      - name: Build binary (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          shards install
          crystal build --release \
            --link-flags="-L$(pwd)/duckdb/build/release -lduckdb -lstdc++ -lm -lpthread" \
            src/main.cr -o bin/${{ matrix.binary }}

      # ---------- Common ----------

      - name: Package binary
        run: tar czvf ${{ matrix.binary }}.tar.gz -C bin ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}.tar.gz

  # ---------- Create versioned GitHub Release ----------

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: updcli-*
          merge-multiple: true

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*.tar.gz
          generate_release_notes: true

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "latest (${{ github.ref_name }})" \
            --notes "Latest release — currently ${{ github.ref_name }}." \
            artifacts/*.tar.gz
