name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: build and cache only the duckdb stage
      - name: Cache duckdb-builder stage
        uses: docker/build-push-action@v7
        with:
          target: duckdb-builder
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=duckdb-builder
          cache-to: type=gha,mode=max,scope=duckdb-builder

      # Step 2: build the full builder stage, pulling duckdb layers from cache
      - name: Build builder image
        uses: docker/build-push-action@v7
        with:
          target: builder
          load: true
          tags: updcli-builder
          cache-from: type=gha,scope=duckdb-builder

      - name: Run specs
        run: docker run --rm updcli-builder make spec

      - name: Run Ameba
        continue-on-error: true # for now
        run: docker run --rm updcli-builder bin/ameba src/
