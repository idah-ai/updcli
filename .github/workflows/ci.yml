name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build spec image
        uses: docker/build-push-action@v6
        with:
          target: spec
          load: true
          tags: updcli-spec
          cache-from: type=gha,scope=duckdb-builder-updcli-linux-amd64

      - name: Run specs
        run: docker run --rm updcli-spec make spec

      - name: Run Ameba
        continue-on-error: true
        run: docker run --rm updcli-spec bin/ameba src/
