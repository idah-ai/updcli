name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        run: |
          docker buildx build \
            --target builder \
            --cache-from type=gha,scope=duckdb-builder \
            --cache-to type=gha,mode=max,scope=duckdb-builder \
            --load \
            -t updcli-builder .

      - name: Run specs
        run: docker run --rm updcli-builder crystal spec --verbose

      - name: Run Ameba
        run: docker run --rm updcli-builder bin/ameba src/
